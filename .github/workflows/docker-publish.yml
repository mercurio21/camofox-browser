name: Build and publish Docker image

# Builds this fork's own Dockerfile (not upstream's Dockerfile.ci, which we
# deleted) and pushes it to this repo's own GHCR package
# (ghcr.io/mercurio21/camofox-browser), separate from upstream's
# ghcr.io/jo-inc/camofox-browser. amd64 only: the only place this image runs
# today is carbon.local (a laptop), not any arm64 host.
# Add linux/arm64 back to platforms below if that changes.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mercurio21/camofox-browser:latest
            ghcr.io/mercurio21/camofox-browser:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
